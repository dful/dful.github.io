<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="t d"><title id="t">Compactación Del Contexto</title><desc id="d">A nearly full context window becomes a smaller representation after compaction, leaving more capacity available.</desc><rect width="1440" height="880" fill="#0d0d0b"/><g font-family="ui-monospace, SFMono-Regular, Consolas, monospace"><text x="76" y="68" fill="#918b80" font-size="18" letter-spacing="3">COMPACTACIÓN DEL CONTEXTO</text><text x="92" y="132" fill="#918b80" font-size="16" letter-spacing="2">ANTES</text><text x="878" y="132" fill="#918b80" font-size="16" letter-spacing="2">DESPUÉS</text><rect x="72" y="146" width="510" height="620" rx="6" fill="none" stroke="#6a6459" stroke-width="2"/><rect x="92" y="166" width="470" height="64" rx="4" fill="#151512" stroke="#454138"/><text x="116" y="205" fill="#f2efe7" font-size="18">Instrucciones</text><rect x="92" y="239" width="470" height="88" rx="4" fill="#151512" stroke="#454138"/><text x="116" y="290" fill="#f2efe7" font-size="18">Conversación antigua</text><rect x="92" y="336" width="470" height="132" rx="4" fill="#151512" stroke="#454138"/><text x="116" y="409" fill="#f2efe7" font-size="18">Tool result grande</text><rect x="92" y="477" width="470" height="76" rx="4" fill="#151512" stroke="#454138"/><text x="116" y="522" fill="#f2efe7" font-size="18">Más conversación</text><rect x="92" y="562" width="470" height="68" rx="4" fill="#151512" stroke="#454138"/><text x="116" y="603" fill="#f2efe7" font-size="18">Estado reciente</text><rect x="92" y="639" width="470" height="64" rx="4" fill="#151512" stroke="#454138"/><text x="116" y="678" fill="#f2efe7" font-size="18">Tarea actual</text><rect x="92" y="712" width="470" height="34" rx="4" fill="#10100e" stroke="#ff9f2f" stroke-dasharray="9 7"/><text x="116" y="736" fill="#ffb45c" font-size="18">Capacidad</text><path d="M620 420h180" stroke="#ff9f2f" stroke-width="3"/><path d="m788 410 14 10