<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d"><title id="t">UTF-16LE byte representation</title><desc id="d">The text abc followed by CRLF is represented by an optional UTF-16 little-endian byte order mark followed by two bytes per code unit.</desc><rect width="1200" height="470" fill="#0d0d0b"/><g font-family="ui-monospace, SFMono-Regular, Consolas, monospace"><text x="60" y="60" fill="#918b80" font-size="16" letter-spacing="3">UTF-16LE BYTE EXAMPLE</text><text x="60" y="108" fill="#f2efe7" font-size="23">"abc\r\n"</text><g stroke="#454138" fill="#151512"><rect x="60" y="155" width="150" height="92" rx="4"/><rect x="225" y="155" width="150" height="92" rx="4"/><rect x="390" y="155" width="150" height="92" rx="4"/><rect x="555" y="155" width="150" height="92" rx="4"/><rect x="720" y="155" width="150" height="92" rx="4"/><rect x="885" y="155" width="150" height="92" rx="4"/></g><g text-anchor="middle"><g fill="#ff9f2f" font-size="24"><text x="135" y="205">FF FE</text></g><g fill="#f2efe7" font-size="24"><text x="300" y="205">61 00</text><text x="465" y="205">62 00</text><text x="630" y="205">63 00</text><text x="795" y="205">0D 00</text><text x="960" y="205">0A 00</text></g><g fill="#918b80" font-size="15"><text x="135" y="232">BOM</text><text x="300" y="232">a · U+0061</text><text x="465" y="232">b · U+0062</text><text x="630" y="232">c · U+0063</text><text x="795" y="232">CR</text><text x="960" y="232">LF</text></g></g><path d="M225 296h810" stroke="#454138"/><text x="60" y="315" fill="#f2efe7" font-size="18">Little-endian</text><text x="225" y="315" fill="#b3aca0" font-size="17">For U+0061, the 16-bit value 0x0061 is stored as bytes 61 00.</text><text x="60" y="365" fill="#f2efe7" font-size="18">BOM</text><text x="225" y="365" fill="#b3aca0" font-size="17">FF FE can identify UTF-16LE at the start of a text stream; the BOM is metadata, not the character "a".</text><text x="60" y="415" fill="#918b80" font-size="16">CRLF and character encoding are separate properties of the file.</text></g></svg>
